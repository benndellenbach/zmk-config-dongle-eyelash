CONFIG_PINCTRL=y
CONFIG_SPI=y
CONFIG_INPUT=y

#EXT POWER
CONFIG_ZMK_EXT_POWER=y

#BLE-passkey
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

#BLE-clean
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

#Dongle should never sleep to accept peripheral connections
CONFIG_ZMK_SLEEP=n

#Fix for nice!nano bluetooth issues with ZMK v0.3 (Issue #3158)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_POINTING=y

# 5 Bluetooth profiles + 2 halves
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# dongle mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# no screen on the dongle (also forced off in build.yaml)
CONFIG_ZMK_DISPLAY=n
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Phone status display: broadcast layer, battery and profile in BLE advertisements
# (prospector-zmk-module v2.2.3, keyboard side only). No pairing and no connection slot.
# Dongle only. The halves never enable this.
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Eyelash"

# The dongle is the central and is neither half, so both halves fill the left and right battery slots
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="AUX"
CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=2

# The dongle runs on USB power, so broadcast faster than the battery-saving defaults.
# Layer, modifier and profile changes always send an instant burst on top of this.
# If split disconnects get worse, go back to 1000 and 30000.
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=200
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=5000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=5000
