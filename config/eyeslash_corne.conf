# halves go to sleep after 20 min idle (20*60*1000 ms); the dongle stays awake on USB power

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1200000

CONFIG_ZMK_SLEEP=y

#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# MOUSE
CONFIG_ZMK_POINTING=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# nice!view screens on the halves (the dongle build turns this off in build.yaml)
CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8

#Fix for nice!nano bluetooth issues with ZMK v0.3 (Issue #3158)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

#disable animation from niceview
#
CONFIG_NICE_VIEW_GEM_ANIMATION=n
